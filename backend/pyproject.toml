[project]
name = "fantasyedge-backend"
version = "0.1.0"
description = "FantasyEdge: fantasy football team advisor (backend)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.1",
  "httpx>=0.27",
  "tenacity>=8.3",
  "nflreadpy>=0.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is enforced by ruff format
